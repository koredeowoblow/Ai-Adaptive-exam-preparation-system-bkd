config:
  target: "http://localhost:3000"
  phases:
    - duration: 60
      arrivalRate: 5
      name: "Warm up (5 VUs)"
    - duration: 120
      arrivalRate: 50
      name: "Ramp up to 50 VUs"
    - duration: 120
      arrivalRate: 200
      name: "Stress test 200 VUs"
  processor: "./processor.js"
