scenarios:
  - name: "Login Flow (Existing User)"
    weight: 80
    flow:
      - post:
          url: "/api/v1/auth/login"
          json:
            email: "student{{ userId }}@loadtest.com"
            password: "password123!"
          afterResponse: "logError"

  - name: "Signup Flow (New User)"
    weight: 20
    flow:
      - post:
          url: "/api/v1/auth/register"
          json:
            name: "New Student {{$randomString()}}"
            email: "new_{{$randomString()}}@loadtest.com"
            password: "password123!"
          afterResponse: "logError"
